<!--
  Chromeless noVNC viewer for River's live browser view.

  Connection state is reported to the embedding window via
  postMessage({type:"novnc:state", ...}). A minimal on-page status line is
  shown until the first successful connect so a bare tab is not a silent
  black screen.

  Posted message payloads (always include `type: "novnc:state"`):
    { state: "connecting", attempt }
    { state: "connected" }
    { state: "reconnecting", attempt, delayMs, reason }
    { state: "disconnected", reason }         — gave up
    { state: "auth_required" }
    { state: "security_failure", reason }

  Query params we honor (set by backend `_build_live_view_url`):
    autoconnect=true        — ignored (always autoconnect)
    resize=remote|scale|off — `remote` → RFB ExtendedDesktopSize; `scale`
                              → CSS scale (default); `off` → native pixels
    view_only=true          — client-side view-only
    path=<ws-path>          — websockify path (default `websockify`)
    password=<pw>           — optional VNC password
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Live</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0b0d;
    }
    #screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }
    #screen > div {
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    #screen canvas {
      display: block;
      margin: auto;
    }
    #status {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 10;
      max-width: calc(100% - 24px);
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.55);
      color: #d7d7db;
      font: 12px/1.4 ui-sans-serif, system-ui, sans-serif;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    #status[data-state="connected"] {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="screen"></div>
  <div id="status" data-state="connecting">Connecting…</div>
  <script type="module">
    import RFB from './core/rfb.js';

    const params = new URL(window.location.href).searchParams;
    const screenEl = document.getElementById('screen');
    const statusEl = document.getElementById('status');
    const resize = params.get('resize') || 'scale';
    const viewOnly = params.get('view_only') === 'true';
    const password = params.get('password') || '';

    let rfb = null;
    let attempt = 0;
    let backoffTimer = null;
    let connecting = false;
    const MAX_ATTEMPTS = 8;
    const BASE_DELAY_MS = 800;
    const MAX_DELAY_MS = 10000;

    function setStatus(state, text) {
      statusEl.dataset.state = state;
      statusEl.textContent = text;
    }

    function postState(payload) {
      try {
        window.parent.postMessage({ type: 'novnc:state', ...payload }, '*');
      } catch (_) { /* ignore */ }
    }

    function buildSocketUrl() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const raw = params.get('path') || 'websockify';
      // Absolute path (e.g. /novnc-ws/<id>/websockify from app proxy).
      if (raw.startsWith('/')) {
        return `${proto}//${window.location.host}${raw}`;
      }
      // Gateway-style path containing slashes (e.g. 6080/<id>/websockify).
      if (raw.includes('/')) {
        return `${proto}//${window.location.host}/${raw.replace(/^\/+/, '')}`;
      }
      // Bare "websockify": resolve under the current directory so both
      // container root (/) and path-gateway (/6080/<id>/) work.
      let base = window.location.pathname || '/';
      if (!base.endsWith('/')) {
        base = base.replace(/\/[^/]*$/, '/');
      }
      if (!base.startsWith('/')) base = `/${base}`;
      return `${proto}//${window.location.host}${base}${raw}`;
    }

    function tearDownRfb() {
      if (!rfb) return;
      try {
        rfb.removeEventListener('connect', onConnect);
        rfb.removeEventListener('disconnect', onDisconnect);
        rfb.removeEventListener('credentialsrequired', onCredentialsRequired);
        rfb.removeEventListener('securityfailure', onSecurityFailure);
        rfb.removeEventListener('desktopname', applyScale);
        rfb.removeEventListener('resize', applyScale);
      } catch (_) { /* ignore */ }
      try { rfb.disconnect(); } catch (_) { /* ignore */ }
      rfb = null;
      connecting = false;
    }

    function scheduleReconnect(reason) {
      tearDownRfb();
      if (attempt >= MAX_ATTEMPTS) {
        setStatus('disconnected', `Disconnected: ${reason || 'gave up'}`);
        postState({ state: 'disconnected', reason });
        return;
      }
      const delayMs = Math.min(BASE_DELAY_MS * 2 ** attempt, MAX_DELAY_MS);
      attempt += 1;
      setStatus('reconnecting', `Reconnecting (${attempt}/${MAX_ATTEMPTS})…`);
      postState({ state: 'reconnecting', attempt, delayMs, reason });
      backoffTimer = setTimeout(connect, delayMs);
    }

    function applyScale() {
      if (!rfb || resize === 'off') return;
      if (resize === 'remote') {
        rfb.resizeSession = true;
        rfb.scaleViewport = false;
        return;
      }
      // Public API only — avoid private _display.scale (reconnect storms / layout races).
      rfb.resizeSession = false;
      rfb.scaleViewport = true;
    }

    function onConnect() {
      attempt = 0;
      connecting = false;
      applyScale();
      requestAnimationFrame(applyScale);
      setStatus('connected', 'Connected');
      postState({ state: 'connected' });
    }

    function onDisconnect(event) {
      connecting = false;
      const detail = event.detail || {};
      scheduleReconnect(detail.reason || (detail.clean ? 'closed' : 'lost'));
    }

    function onCredentialsRequired() {
      attempt = MAX_ATTEMPTS;
      connecting = false;
      setStatus('auth_required', 'VNC password required');
      postState({ state: 'auth_required' });
    }

    function onSecurityFailure(event) {
      attempt = MAX_ATTEMPTS;
      connecting = false;
      const detail = event.detail || {};
      const reason = detail.reason || 'unknown';
      setStatus('security_failure', `Security failure: ${reason}`);
      postState({ state: 'security_failure', reason });
    }

    function connect() {
      backoffTimer = null;
      if (connecting) return;
      tearDownRfb();
      connecting = true;
      setStatus('connecting', attempt ? `Connecting (try ${attempt + 1})…` : 'Connecting…');
      postState({ state: 'connecting', attempt });

      let url;
      try {
        url = buildSocketUrl();
        rfb = new RFB(screenEl, url, {
          credentials: { password },
          shared: true,
        });
      } catch (err) {
        connecting = false;
        scheduleReconnect((err && err.message) || 'init_error');
        return;
      }

      rfb.viewOnly = viewOnly;
      rfb.resizeSession = resize === 'remote';
      rfb.scaleViewport = resize !== 'off';
      rfb.background = '#0b0b0d';

      rfb.addEventListener('connect', onConnect);
      rfb.addEventListener('desktopname', applyScale);
      rfb.addEventListener('resize', applyScale);
      rfb.addEventListener('disconnect', onDisconnect);
      rfb.addEventListener('credentialsrequired', onCredentialsRequired);
      rfb.addEventListener('securityfailure', onSecurityFailure);
    }

    // Only retry on focus if we already gave up — do not open parallel sockets.
    window.addEventListener('focus', () => {
      if (rfb && rfb._rfbConnectionState === 'connected') return;
      if (connecting || backoffTimer) return;
      if (attempt < MAX_ATTEMPTS) return;
      attempt = 0;
      connect();
    });

    window.addEventListener('resize', () => {
      applyScale();
    });

    window.addEventListener('beforeunload', () => {
      if (backoffTimer) clearTimeout(backoffTimer);
      tearDownRfb();
    });

    connect();
  </script>
</body>
</html>
