services:
  cube-leagent:
    build:
      context: .
      args:
        INSTALL_PI: ${INSTALL_PI:-1}
        PI_SUITE_VERSION: ${PI_SUITE_VERSION:-0.1.17}
        PI_SUITE: ${PI_SUITE:-npm:@lebronj/pi-suite}
        PI_WORKSPACE_DIR: ${PI_WORKSPACE_DIR:-/workspace}
        PI_EVOLUTION_ENABLED: ${PI_EVOLUTION_ENABLED:-1}
    image: coforge-pi:local
    # The Swarm image starts `coforge-computer foreground`. This local service
    # still opens the web terminal.
    entrypoint: ["/usr/local/bin/cube-start.sh"]
    network_mode: host
    env_file:
      - path: ./config/pi.env
        required: false
    environment:
      PI_WEB_HOST: "0.0.0.0"
      PI_WEB_PORT: "${PI_WEB_HOST_PORT:-6079}"
      PI_WEB_WORKSPACE: "${PI_WORKSPACE_DIR:-/workspace}"
      PI_WEB_TERM_TOKEN: "${PI_WEB_TERM_TOKEN:-}"
      PI_WEB_TERM_SHELL: "${PI_WEB_TERM_SHELL:-/bin/bash}"
      PI_WEB_CONSOLE: "0"
      COFORGE_WORKSPACE_SLUG: "${COFORGE_WORKSPACE_SLUG:-my}"
